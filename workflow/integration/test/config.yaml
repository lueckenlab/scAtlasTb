output_dir: test/out
images: test/images

use_gpu: false
env_mode: local

resources:
  cpu:
    partition: cpu
    qos: normal
    gpu: 0
    mem_mb: 1000
  gpu:
    partition: gpu
    qos: normal
    gpu: 1
    mem_mb: 4000

defaults:
  integration:
    raw_counts: layers/counts
    norm_counts: layers/normcounts
    var_mask: highly_variable
    save_subset: false
  datasets:
    - test
    - multi_wildcards
    - preprocessed
    - harmony
    - seurat_rpca
    - scarches
    - scvi_tools
    - drvi
    - sysvi


DATASETS:
  test:
    input:
      integration:
        pbmc68k: test/input/pbmc68k.h5ad
        # unprocessed: test/input/pbmc68k_unprocessed.h5ad
    integration:
      var_mask:
        - highly_variable
      threads: 3
      batch: batch
      umap_colors:
        - bulk_labels
        - phase
      methods:
        bbknn:
          neighbors_within_batch: 3
        combat:
          covariates:
            - bulk_labels
        scanorama:
          batch_size: 100
        unintegrated:

  multi_wildcards:
    input:
      integration:
        pbmc: test/input/pbmc68k.h5ad
    integration:
      methods:
        unintegrated:
      label:
        - bulk_labels
        - louvain
      batch:
        - phase
        - batch_2
      output_types:
        - embed
        - knn
      var_mask:
        - highly_variable
        - highly_variable_2
      neighbors:
        n_neighbors: 30

  preprocessed:
    input:
      integration: test/input/preprocessing/dataset~all/file_id~pbmc.zarr
    integration:
      label: bulk_labels
      batch: batch
      methods:
        unintegrated:
        scgen:
          n_epochs: 10
        scvi:
          max_epochs: 100
        drvi:
          max_epochs: 100
        

  harmony:
    input:
      integration: test/input/pbmc68k.h5ad
    integration:
      threads: 5
      label: bulk_labels
      batch: batch
      methods:
        harmonypy:
          sigma: 0.1
          key: batch_2
          n_comps:
            - 10
            - 30
        harmony_pytorch:
          sigma: 0.1
          batch_key: batch_2
          n_comps:
            - 30
            - mcv
          scale: true
      umap_colors:
        - phase
        - bulk_labels

  seurat_rpca:
    input:
      integration: test/input/pbmc68k.h5ad
    integration:
      threads: 2
      label: bulk_labels
      batch: batch
      methods:
        seurat_rpca:
          dims: 20
          reference:
            -
            - ['0', '1']
      umap_colors:
        - batch
        - bulk_labels

  scarches:
    input:
      integration: test/input/pbmc68k.h5ad
    integration:
      label: bulk_labels
      batch: batch
      methods:
        scgen:
          hidden_layer_sizes: [128, 128]
          n_epochs: 10
          early_stopping_kwargs:
            early_stopping_metric: val_loss
            patience: 20
            threshold: 0
            reduce_lr: true
            lr_patience: 13
            lr_factor: 0.1
        scpoli:
          cell_type_keys:
            - 
            - bulk_labels
          embedding_dims: 5
          recon_loss: nb
          n_epochs: 50
          early_stopping_kwargs:
            early_stopping_metric: val_prototype_loss
            mode: min
            threshold: 0
            patience: 20
            reduce_lr: true
            lr_patience: 13
            lr_factor: 0.1
      umap_colors:
        - bulk_labels
        - phase

  scvi_tools:
    input:
      integration:
        orig: test/input/pbmc68k.h5ad
    integration:
      threads: 3
      label: bulk_labels
      batch: batch
      methods:
        scvi:
          n_hidden: 128
          dispersion: gene
          categorical_covariate_keys:
            -
            - [batch_2]
            - [batch_2, phase]
          use_observed_lib_size: true
          max_epochs: 20
          early_stopping: true
        scvi_vitkl:
          dispersion: gene-batch
          use_observed_lib_size: false
          n_hidden: 3000
          n_layers: 1
          n_latent: 700
          library_n_hidden: 16
          library_log_vars_weight: 0.05
          scale_activation: softplus
          use_additive_background: true
          use_batch_in_decoder: false
          regularise_dispersion: true
          extra_encoder_kwargs:
            dropout_on_input: true
          extra_decoder_kwargs:
            dropout_on_input: true
          max_epochs: 20
          early_stopping: true
        scanvi:
          n_hidden: 128
          dispersion: gene
          continuous_covariate_keys:
            - percent_mito
          max_epochs: 20
          early_stopping: true
          scanvi_max_epochs: 10
          scanvi_early_stopping: true
      umap_colors:
        - bulk_labels
        - phase
        - percent_mito

  sysvi:
    input:
      integration:
        orig: test/input/pbmc68k.h5ad
    integration:
      label: bulk_labels
      batch: batch
      methods:
        sysvi:
          system_key: phase
          prior: vamp
          n_prior_components: 5
          max_epochs: 20
          early_stopping: true
      umap_colors:
        - bulk_labels
        - phase
        - percent_mito

  drvi:
    input:
      integration:
        orig: test/input/pbmc68k.h5ad
    integration:
      label: bulk_labels
      batch: batch
      methods:
        drvi:
          n_latent: 128
          encoder_dims:
            - [128, 128]
          decoder_dims:
            - [128, 128]
          plan_kwargs:
          - n_epochs_kl_warmup: 10
          max_epochs: 20
          early_stopping:
            - false
            - true
      umap_colors:
        - bulk_labels
        - phase
        - percent_mito