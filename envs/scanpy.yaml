name: scanpy
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - anndata=0.11
  - scanpy=1.11
  - leidenalg
  - louvain
  - scikit-learn<1.6 # required by dask-ml
  - dask<2024.8
  - dask-ml
  - sparse
  - scipy<1.17
  - zarr<3
  - pandas<3
  - harmony-pytorch
  - harmonypy<0.1  # >=0.2 returns Z_corr as cells x dims, which breaks scanpy 1.11 harmony_integrate
